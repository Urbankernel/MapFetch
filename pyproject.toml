[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mapfetch"
version = "0.1.0.dev0"
description = "多元地图数据下载工具：从天地图/高德/百度下载瓦片与基础地理矢量要素，输出 GeoTIFF / GeoPackage"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "MIT"
authors = [{ name = "siwei" }]
keywords = ["gis", "map-tiles", "tianditu", "amap", "baidu-map", "vectorization"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Science/Research",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
]

dependencies = [
    "httpx>=0.27",
    "rasterio>=1.3",
    "numpy>=1.26",
    "Pillow>=10.0",
    "scikit-image>=0.22",
    "geopandas>=0.14",
    "pyogrio>=0.7",
    "shapely>=2.0",
    "selenium>=4.15",
    "pydantic>=2.5",
    "PyYAML>=6.0",
    "PySide6==6.8.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[project.scripts]
mapfetch = "mapfetch.ui.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mapfetch = [
    "ui/assets/*",
    "ui/assets/leaflet/*",
    "fetch/templates/*",
]

[tool.ruff]
line-length = 100
target-version = "py311"
